<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>Orbit — Scientific Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #0c0d12;
      --panel: #15161d;
      --panel-raised: #1b1c25;
      --display: #111219;
      --key: #22232d;
      --key-hover: #30313e;
      --text: #f3f4fa;
      --muted: #898b9c;
      --line: #292a35;
      --blue: #70a7ff;
      --purple: #a88bff;
      --shadow: 0 30px 90px #0008;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --page: #f0f2f8;
      --panel: #fff;
      --panel-raised: #f4f5fa;
      --display: #f5f6fb;
      --key: #eef0f6;
      --key-hover: #e2e5ef;
      --text: #191b27;
      --muted: #777b8d;
      --line: #e5e7ef;
      --blue: #3978e8;
      --purple: #7956df;
      --shadow: 0 24px 70px #3039551c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 32px 18px; background: radial-gradient(ellipse at 50% 0%, #272141 0, var(--page) 48%);
      color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background .25s, color .25s;
    }
    :root[data-theme="light"] body { background: radial-gradient(ellipse at 50% 0%, #dfe7ff 0, var(--page) 55%); }
    button { font: inherit; }
    .app { width: min(100%, 1050px); }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin: 0 2px 18px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; color: white; font-weight: 800; background: linear-gradient(140deg, #5eaaff, #9a6cff); box-shadow: 0 6px 24px #765dff55; }
    .brand-name { font-weight: 750; letter-spacing: -.04em; font-size: 19px; }
    .brand-sub { color: var(--muted); font-size: 11px; margin-top: 2px; letter-spacing: .04em; }
    .icon-button, .mode-button, .utility-button {
      border: 1px solid var(--line); background: var(--panel); color: var(--muted);
      border-radius: 12px; cursor: pointer; transition: .18s ease;
    }
    .icon-button { width: 42px; height: 42px; font-size: 17px; }
    .icon-button:hover, .mode-button:hover, .utility-button:hover { color: var(--text); border-color: #7770b5; transform: translateY(-1px); }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 275px; gap: 16px; align-items: stretch; }
    .calculator, .history-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
    .calculator { padding: 20px; }
    .display { min-height: 150px; padding: 17px 19px 15px; border: 1px solid var(--line); border-radius: 16px; background: var(--display); margin-bottom: 15px; display: flex; flex-direction: column; }
    .display-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .mode-button { padding: 7px 11px; font-weight: 750; font-size: 11px; letter-spacing: .09em; color: var(--blue); }
    .expression { color: var(--muted); font-size: clamp(14px, 2vw, 17px); text-align: right; overflow-wrap: anywhere; min-height: 27px; flex: 1; padding-top: 5px; }
    .result-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
    .result { min-width: 0; width: 100%; text-align: right; font-size: clamp(32px, 6vw, 46px); line-height: 1.2; letter-spacing: -.055em; font-weight: 550; overflow-x: auto; scrollbar-width: none; }
    .result::-webkit-scrollbar { display: none; }
    .result.error { color: #ff777f; font-size: clamp(20px, 4vw, 28px); letter-spacing: -.02em; }
    .copy-button { flex: 0 0 36px; width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; }
    .copy-button:hover { color: var(--blue); background: var(--key); }
    .utility-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .utility-button { flex: 1; min-height: 34px; font-size: 11px; font-weight: 700; }
    .keypad { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 9px; }
    .key {
      min-width: 0; min-height: 51px; padding: 8px 4px; border: 1px solid transparent; border-radius: 12px;
      background: var(--key); color: var(--text); cursor: pointer; font-size: 15px; font-weight: 600;
      transition: transform .14s, background .14s, border-color .14s, box-shadow .14s;
    }
    .key:hover { background: var(--key-hover); border-color: #7770b54d; transform: translateY(-2px); }
    .key:active { transform: scale(.96); }
    .key.function { color: var(--purple); font-size: 13px; }
    .key.operator { color: var(--blue); font-size: 19px; background: color-mix(in srgb, var(--blue) 8%, var(--key)); }
    .key.soft { color: var(--muted); font-size: 13px; }
    .key.danger { color: #ff858d; }
    .key.equals { color: white; background: linear-gradient(135deg, #478ff0, #8b62ea); border: 0; font-size: 21px; box-shadow: 0 7px 20px #6d63ed38; }
    .key.equals:hover { background: linear-gradient(135deg, #5ba0ff, #9a74f5); box-shadow: 0 9px 24px #6d63ed55; }
    .history-panel { padding: 18px 16px; display: flex; flex-direction: column; min-height: 100%; }
    .history-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 15px; border-bottom: 1px solid var(--line); }
    .history-title { font-size: 14px; font-weight: 750; }
    .clear-history { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; }
    .clear-history:hover { color: #ff858d; }
    .history-list { overflow-y: auto; max-height: 500px; }
    .history-empty { color: var(--muted); text-align: center; font-size: 12px; line-height: 1.6; margin: auto; padding: 35px 9px; }
    .history-item { padding: 13px 3px; border-bottom: 1px solid var(--line); cursor: pointer; animation: appear .22s ease both; }
    .history-item:hover .history-value { color: var(--blue); }
    .history-expression { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; line-height: 1.5; }
    .history-value { font-size: 18px; margin-top: 4px; font-weight: 600; transition: color .15s; }
    .hint { margin: 14px 3px 0; color: var(--muted); font-size: 10px; line-height: 1.7; }
    kbd { font: inherit; background: var(--key); border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; }
    @keyframes appear { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 760px) {
      body { padding: 20px 12px; }
      .workspace { grid-template-columns: 1fr; }
      .history-panel { min-height: 150px; max-height: 260px; }
      .history-list { max-height: 180px; }
      .history-empty { padding: 20px; }
    }
    @media (max-width: 430px) {
      .calculator { padding: 12px; border-radius: 18px; }
      .keypad { gap: 6px; }
      .key { min-height: 47px; font-size: 14px; border-radius: 10px; }
      .key.function { font-size: 11px; }
      .key.soft { font-size: 11px; }
      .display { min-height: 135px; padding: 13px; }
      .topbar { margin-bottom: 13px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">∑</div><div><div class="brand-name">orbit</div><div class="brand-sub">SCIENTIFIC CALCULATOR</div></div></div>
      <button class="icon-button" id="theme-toggle" aria-label="Switch theme" title="Toggle light and dark theme">☼</button>
    </header>
    <div class="workspace">
      <section class="calculator" aria-label="Scientific calculator">
        <div class="display" aria-live="polite">
          <div class="display-top"><button class="mode-button" id="angle-mode">DEG</button><div class="expression" id="expression"></div></div>
          <div class="result-row"><div class="result" id="result">0</div><button class="copy-button" id="copy-result" title="Copy result" aria-label="Copy result">▢</button></div>
        </div>
        <div class="utility-row">
          <button class="utility-button" data-memory="clear">MC</button><button class="utility-button" data-memory="recall">MR</button>
          <button class="utility-button" data-memory="add">M+</button><button class="utility-button" data-memory="subtract">M−</button>
        </div>
        <div class="keypad" id="keypad">
          <button class="key function" data-insert="sin(">sin</button><button class="key function" data-insert="cos(">cos</button><button class="key function" data-insert="tan(">tan</button><button class="key function" data-insert="asin(">sin⁻¹</button><button class="key function" data-insert="acos(">cos⁻¹</button><button class="key function" data-insert="atan(">tan⁻¹</button>
          <button class="key function" data-insert="log(">log</button><button class="key function" data-insert="ln(">ln</button><button class="key function" data-insert="√(">√</button><button class="key function" data-insert="∛(">∛</button><button class="key function" data-insert="abs("> |x| </button><button class="key danger" data-action="clear">AC</button>
          <button class="key function" data-insert="π">π</button><button class="key function" data-insert="e">e</button><button class="key function" data-insert="^2">x²</button><button class="key function" data-insert="^3">x³</button><button class="key function" data-insert="^">xʸ</button><button class="key danger" data-action="delete">DEL</button>
          <button class="key function" data-insert="!">x!</button><button class="key function" data-insert="exp(">eˣ</button><button class="key function" data-insert="10^(">10ˣ</button><button class="key function" data-action="reciprocal">1/x</button><button class="key function" data-insert="%">%</button><button class="key operator" data-insert="÷">÷</button>
          <button class="key soft" data-insert="(">(</button><button class="key soft" data-insert=")">)</button><button class="key" data-insert="7">7</button><button class="key" data-insert="8">8</button><button class="key" data-insert="9">9</button><button class="key operator" data-insert="×">×</button>
          <button class="key soft" data-action="sign">+/−</button><button class="key soft" data-insert="Ans">Ans</button><button class="key" data-insert="4">4</button><button class="key" data-insert="5">5</button><button class="key" data-insert="6">6</button><button class="key operator" data-insert="−">−</button>
          <button class="key soft" data-action="copy">COPY</button><button class="key soft" data-insert="π">π</button><button class="key" data-insert="1">1</button><button class="key" data-insert="2">2</button><button class="key" data-insert="3">3</button><button class="key operator" data-insert="+">+</button>
          <button class="key soft" data-insert="00">00</button><button class="key soft" data-insert=".">.</button><button class="key" data-insert="0">0</button><button class="key soft" data-action="open">( )</button><button class="key operator" data-insert="−">−</button><button class="key equals" data-action="equals">=</button>
        </div>
        <div class="hint">Enter to calculate · Esc to clear · Backspace to delete · Click a history result to reuse it</div>
      </section>
      <aside class="history-panel">
        <div class="history-head"><div class="history-title">History</div><button class="clear-history" id="clear-history">Clear all</button></div>
        <div class="history-list" id="history-list"><div class="history-empty">Your calculations will appear here.</div></div>
      </aside>
    </div>
  </main>
  <script>
    (() => {
      const $ = (selector) => document.querySelector(selector);
      const expressionEl = $("#expression"), resultEl = $("#result"), keypad = $("#keypad");
      let expression = "", answer = 0, memory = 0, degrees = true, justEvaluated = false;
      const history = [];

      function format(value) {
        if (!Number.isFinite(value)) throw new Error(value === Infinity || value === -Infinity ? "Cannot divide by zero" : "Result is not a real number");
        if (Object.is(value, -0)) value = 0;
        if (Math.abs(value) >= 1e12 || (value !== 0 && Math.abs(value) < 1e-8)) return value.toExponential(8).replace(/\.?0+e/, "e").replace("e+", "e");
        return Number(value.toPrecision(12)).toString();
      }

      function tokenize(source) {
        const tokens = [];
        const pattern = /\s*([0-9]+(?:\.[0-9]*)?|\.[0-9]+|(?:sin|cos|tan|asin|acos|atan|log|ln|abs|exp|Ans|π|√|∛|e)|[()+\-−×÷*/^%!])/gy;
        let pos = 0;
        while (pos < source.length) {
          pattern.lastIndex = pos;
          const match = pattern.exec(source);
          if (!match) throw new Error("Invalid expression");
          tokens.push(match[1]);
          pos = pattern.lastIndex;
        }
        return tokens;
      }

      function calculate(source) {
        const tokens = tokenize(source);
        let i = 0;
        const peek = () => tokens[i];
        const eat = () => tokens[i++];
        const startsValue = (token) => token !== undefined && (/^(?:[0-9]|\.)/.test(token) || ["(", "π", "e", "Ans", "sin", "cos", "tan", "asin", "acos", "atan", "log", "ln", "abs", "exp", "√", "∛"].includes(token));
        function primary() {
          const token = eat();
          if (token === undefined) throw new Error("Incomplete expression");
          if (token === "(") {
            const value = sum();
            if (eat() !== ")") throw new Error("Missing closing bracket");
            return value;
          }
          if (/^(?:[0-9]|\.)/.test(token)) return Number(token);
          if (token === "π") return Math.PI;
          if (token === "e") return Math.E;
          if (token === "Ans") return answer;
          const functions = {
            sin: x => Math.sin(degrees ? x * Math.PI / 180 : x),
            cos: x => Math.cos(degrees ? x * Math.PI / 180 : x),
            tan: x => {
              const radians = degrees ? x * Math.PI / 180 : x;
              if (Math.abs(Math.cos(radians)) < 1e-14) throw new Error("Tangent is undefined");
              return Math.tan(radians);
            },
            asin: x => { if (x < -1 || x > 1) throw new Error("asin input must be between −1 and 1"); const r = Math.asin(x); return degrees ? r * 180 / Math.PI : r; },
            acos: x => { if (x < -1 || x > 1) throw new Error("acos input must be between −1 and 1"); const r = Math.acos(x); return degrees ? r * 180 / Math.PI : r; },
            atan: x => { const r = Math.atan(x); return degrees ? r * 180 / Math.PI : r; },
            log: x => { if (x <= 0) throw new Error("log input must be positive"); return Math.log10(x); },
            ln: x => { if (x <= 0) throw new Error("ln input must be positive"); return Math.log(x); },
            abs: x => Math.abs(x), exp: x => Math.exp(x),
            "√": x => { if (x < 0) throw new Error("Square root input must be non-negative"); return Math.sqrt(x); },
            "∛": x => Math.cbrt(x)
          };
          if (functions[token]) {
            let value;
            if (peek() === "(") { eat(); value = sum(); if (eat() !== ")") throw new Error("Missing closing bracket"); }
            else value = unary();
            return functions[token](value);
          }
          throw new Error("Invalid expression");
        }
        function postfix() {
          let value = primary();
          while (peek() === "!" || peek() === "%") {
            const op = eat();
            if (op === "%") value /= 100;
            else {
              if (value < 0 || !Number.isInteger(value)) throw new Error("Factorial requires a non-negative integer");
              if (value > 170) throw new Error("Factorial result is too large");
              let result = 1;
              for (let n = 2; n <= value; n++) result *= n;
              value = result;
            }
          }
          return value;
        }
        function power() {
          let value = postfix();
          if (peek() === "^") { eat(); value = Math.pow(value, unary()); }
          return value;
        }
        function unary() {
          if (peek() === "+" || peek() === "-" || peek() === "−") { const op = eat(); const value = unary(); return op === "+" ? value : -value; }
          return power();
        }
        function product() {
          let value = unary();
          while (peek() === "×" || peek() === "÷" || peek() === "*" || peek() === "/"
            || (startsValue(peek()) && tokens[i - 1] !== "(")) {
            const op = (peek() === "×" || peek() === "÷" || peek() === "*" || peek() === "/") ? eat() : "×";
            const right = unary();
            value = op === "÷" || op === "/" ? value / right : value * right;
          }
          return value;
        }
        function sum() {
          let value = product();
          while (peek() === "+" || peek() === "-" || peek() === "−") {
            const op = eat(), right = product();
            value = op === "+" ? value + right : value - right;
          }
          return value;
        }
        if (!tokens.length) throw new Error("Enter an expression");
        const value = sum();
        if (i !== tokens.length) throw new Error(peek() === ")" ? "Unexpected closing bracket" : "Invalid expression");
        if (Number.isNaN(value)) throw new Error("Invalid mathematical operation");
        return value;
      }

      function update() {
        expressionEl.textContent = expression || "";
        resultEl.classList.remove("error");
        if (!expression) { resultEl.textContent = "0"; return; }
        try { resultEl.textContent = format(calculate(expression)); }
        catch (error) {
          if (error.message !== "Incomplete expression" && error.message !== "Missing closing bracket") {
            resultEl.textContent = error.message;
            resultEl.classList.add("error");
          } else resultEl.textContent = "…";
        }
      }
      function insert(value) {
        if (justEvaluated && (/^[0-9.]$/.test(value) || value === "00")) expression = "";
        justEvaluated = false;
        const endOfValue = /[0-9.)πe!%]$/.test(expression);
        const startsNewValue = /^(?:[0-9.]|π|e|Ans|sin|cos|tan|asin|acos|atan|log|ln|abs|exp|√|∛|\()/.test(value);
        const appendingNumber = /(?:[0-9]+\.?[0-9]*|\.[0-9]+)$/.test(expression) && (/^(?:[0-9]|\.)$/.test(value) || value === "00");
        if (endOfValue && startsNewValue && !appendingNumber) expression += "×";
        if (value === "^2" || value === "^3" || value === "!" || value === "%") {
          if (!expression) return;
        }
        expression += value;
        update();
      }
      function clear() { expression = ""; justEvaluated = false; update(); }
      function evaluate() {
        if (!expression) return;
        try {
          const value = calculate(expression), pretty = format(value);
          history.unshift({ expression, result: pretty });
          history.splice(12);
          answer = value;
          expression = pretty;
          justEvaluated = true;
          renderHistory();
          update();
        } catch (error) { resultEl.textContent = error.message; resultEl.classList.add("error"); }
      }
      function renderHistory() {
        const list = $("#history-list");
        list.replaceChildren();
        if (!history.length) { const empty = document.createElement("div"); empty.className = "history-empty"; empty.textContent = "Your calculations will appear here."; list.append(empty); return; }
        history.forEach(item => {
          const row = document.createElement("div"); row.className = "history-item"; row.title = "Reuse result";
          const exp = document.createElement("div"); exp.className = "history-expression"; exp.textContent = item.expression;
          const val = document.createElement("div"); val.className = "history-value"; val.textContent = "= " + item.result;
          row.append(exp, val);
          row.addEventListener("click", () => { expression = item.result; answer = Number(item.result); justEvaluated = true; update(); });
          list.append(row);
        });
      }
      async function copyResult() {
        try {
          const value = expression ? format(calculate(expression)) : "0";
          await navigator.clipboard.writeText(value);
          $("#copy-result").textContent = "✓";
          setTimeout(() => { $("#copy-result").textContent = "▢"; }, 900);
        } catch (error) {
          resultEl.textContent = error.message === "Enter an expression" ? "Nothing to copy" : "Copy unavailable";
          resultEl.classList.add("error");
        }
      }

      keypad.addEventListener("click", event => {
        const button = event.target.closest("button");
        if (!button) return;
        if (button.dataset.insert !== undefined) insert(button.dataset.insert);
        if (button.dataset.action === "clear") clear();
        if (button.dataset.action === "delete") { expression = expression.slice(0, -1); justEvaluated = false; update(); }
        if (button.dataset.action === "equals") evaluate();
        if (button.dataset.action === "copy") copyResult();
        if (button.dataset.action === "reciprocal") {
          expression = expression ? `1/(${expression})` : "1/(";
          justEvaluated = false;
          update();
        }
        if (button.dataset.action === "sign") { expression = expression ? `−(${expression})` : "−"; justEvaluated = false; update(); }
        if (button.dataset.action === "open") insert(expression && /[0-9.)πe!]$/.test(expression) ? "×(" : "(");
      });
      document.querySelectorAll("[data-memory]").forEach(button => button.addEventListener("click", () => {
        const action = button.dataset.memory;
        if (action === "clear") memory = 0;
        if (action === "recall") insert(format(memory));
        if (action === "add" || action === "subtract") {
          try { const current = expression ? calculate(expression) : 0; memory += action === "add" ? current : -current; }
          catch (error) { resultEl.textContent = error.message; resultEl.classList.add("error"); }
        }
      }));
      $("#angle-mode").addEventListener("click", event => { degrees = !degrees; event.currentTarget.textContent = degrees ? "DEG" : "RAD"; update(); });
      $("#theme-toggle").addEventListener("click", () => {
        const light = document.documentElement.dataset.theme !== "light";
        document.documentElement.dataset.theme = light ? "light" : "dark";
        $("#theme-toggle").textContent = light ? "☾" : "☼";
        localStorage.setItem("orbit-theme", light ? "light" : "dark");
      });
      $("#clear-history").addEventListener("click", () => { history.length = 0; renderHistory(); });
      $("#copy-result").addEventListener("click", copyResult);
      try {
        const savedTheme = localStorage.getItem("orbit-theme");
        if (savedTheme) { document.documentElement.dataset.theme = savedTheme; $("#theme-toggle").textContent = savedTheme === "light" ? "☾" : "☼"; }
      } catch (error) { /* Theme persistence is optional when storage is unavailable. */ }
      document.addEventListener("keydown", event => {
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.key === "Enter" || event.key === "=") { event.preventDefault(); evaluate(); }
        else if (event.key === "Escape") clear();
        else if (event.key === "Backspace") { event.preventDefault(); expression = expression.slice(0, -1); justEvaluated = false; update(); }
        else if (/^[0-9.]$/.test(event.key)) insert(event.key);
        else if (["+", "-", "*", "/", "^", "(", ")", "%", "!"].includes(event.key)) insert(({ "*": "×", "/": "÷", "-": "−" })[event.key] || event.key);
        else if (event.key.toLowerCase() === "p") insert("π");
      });
      update();
    })();
  </script>
</body>
</html>
